name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: testes (com detector de corrida)
        run: go test -race -coverprofile=cobertura.out ./...

      - name: cobertura
        run: go tool cover -func=cobertura.out | tail -n 1

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: false
