name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./... && go vet -tags integracao ./...

      - name: testes (com detector de corrida)
        run: go test -race -coverprofile=cobertura.out ./...

      - name: cobertura
        run: go tool cover -func=cobertura.out | tail -n 1

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Postgres de verdade via testcontainers. Mais lento: só na main.
  integracao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: testes de integração
        run: go test -race -tags integracao ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: false