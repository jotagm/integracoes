# Lado de escrita, no lab: Postgres do event store e Kafka.
# Os containers do binário (ingestor, relay, projetor) entram no deploy.
#
#   docker compose -f deploy/lab/docker-compose.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: integracoes
      POSTGRES_USER: integracoes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # 5433 para não brigar com outro Postgres que já esteja no lab.
    # Só escuta no próprio lab: ninguém de fora alcança o event store.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eventstore:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integracoes -d integracoes"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka em modo KRaft, um broker só. A imagem oficial já sobe configurada
  # para um nó único anunciando localhost:9092.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  eventstore:
  kafka:
